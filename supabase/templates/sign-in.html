<h2>Sign in to RoamJS</h2>
<p>Your one-time sign-in code is:</p>
<p><strong>{{ .Token }}</strong></p>
<p>Enter this code on the RoamJS account page where you requested it.</p>
<p>Or <a href="{{ .ConfirmationURL }}">sign in with this link</a> in the same browser.</p>
<p>If you did not request this email, you can ignore it.</p>
